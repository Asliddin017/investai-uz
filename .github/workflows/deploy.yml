# push main → test → image build → smoke (migrate + seed + /api/health) → GHCR :latest
# Serverda Watchtower (--scope investai) yangi :latest ni ~2 daqiqada o'zi tortadi.
name: CI + GHCR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/asliddin017/investai-uz

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke — migrate + seed + /api/health
        run: |
          docker run -d --name app --network host \
            -e DATABASE_URL=postgresql://app:app@localhost:5432/app \
            -e AUTH_SECRET=ci-only-secret-at-least-32-characters-long -e SEED_PASSWORD=Ci12345678 -e SKIP_SEED=0 \
            app:ci
          for i in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Running}}' app)" != "true" ]; then
              docker logs app; echo "container exited"; exit 1
            fi
            if curl -fsS http://localhost:3000/api/health; then echo; echo "smoke OK"; exit 0; fi
            sleep 3
          done
          docker logs app
          exit 1

      - name: Login GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

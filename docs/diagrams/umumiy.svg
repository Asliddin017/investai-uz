<text x="74" y="1836" font-size="15" font-weight="700" fill="#1f2d2d">Muhim qoidalar:</text>
<text x="74" y="1857" font-size="15" font-weight="400" fill="#1f2d2d">• Tizim hozircha faqat viloyat hokimligi uchun ishlaydi.</text>
<text x="74" y="1878" font-size="15" font-weight="400" fill="#1f2d2d">• Rejani tasdiqlovchi — viloyat apparati investitsiya bo'limi kotibiyat mudiri.</text>
<text x="74" y="1899" font-size="15" font-weight="400" fill="#1f2d2d">• Tasdiqlangan reja o'zgartirilmaydi. Rad etilgan reja yaratuvchisiga qayta tahrirlash uchun qaytariladi.</text>

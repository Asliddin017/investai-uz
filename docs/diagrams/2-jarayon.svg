<text x="480" y="722.0" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2d2d">bajarildimi?</text>
<rect x="36" y="650" width="210" height="110" rx="10" fill="#fff7e6" stroke="#e8a23c" stroke-width="1.5"/>

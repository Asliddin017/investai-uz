<polygon points="707.0,355 735.0,307.0 909.0,307.0 937.0,355 909.0,403.0 735.0,403.0" fill="#fde6db" stroke="#1f2d2d" stroke-width="2"/>
<text x="822" y="338.9" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2d2d">Tuzatiladi</text>
<text x="822" y="360.9" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2d2d">birinchi varianti</text>
<text x="822" y="382.9" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2d2d">tarixda saqlanadi</text>

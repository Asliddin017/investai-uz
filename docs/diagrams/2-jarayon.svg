<text x="480" y="530.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2d2d">3. Xorijiy safar</text>
<text x="480" y="552.0" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2d2d">rejadagi ishlar bajariladi</text>

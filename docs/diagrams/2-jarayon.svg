<text x="50" y="697" font-size="15" font-weight="400" fill="#1f2d2d">10 ta reja bandi</text>
<text x="50" y="718" font-size="15" font-weight="400" fill="#1f2d2d">→ 8 tasi erishildi</text>
<text x="50" y="739" font-size="15" font-weight="400" fill="#1f2d2d">→ 2 tasi erishilmadi</text>

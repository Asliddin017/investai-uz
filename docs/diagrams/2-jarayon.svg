<text x="480" y="176.9" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2d2d">nomi · maqsadi · muddati · yo'l xaritasi</text>
<path d="M480,216 L480,283" fill="none" stroke="#2e7d32" stroke-width="2.2" marker-end="url(#g)"/>

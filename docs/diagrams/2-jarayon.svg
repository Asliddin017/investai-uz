<text x="480" y="371.9" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2d2d">tasdiqlaydimi?</text>
<text x="492" y="255" text-anchor="start" font-size="15" font-style="italic" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="6">tasdiqqa yuboriladi</text>

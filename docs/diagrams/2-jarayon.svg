<text x="270" y="864.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2d2d">Erishilgan kelishuv (YUTUQ)</text>
<text x="270" y="886.0" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2d2d">shartnoma + amalga oshish muddati</text>
<text x="270" y="908.0" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2d2d">(masalan, 1 oydan keyin)</text>

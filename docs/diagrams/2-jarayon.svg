<rect width="960" height="1120" fill="#ffffff"/>
<text x="480.0" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2d2d">Reja qanday ishlaydi?</text>
<text x="480.0" y="72" text-anchor="middle" font-size="16" fill="#666">Rejadan natijagacha — 5 qadam</text>
